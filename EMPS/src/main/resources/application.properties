spring.application.name=EPMS

# ===============================
# = DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/epms_project
spring.datasource.username=root
spring.datasource.password=root@12345!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = JPA / HIBERNATE CONFIG
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Security configuration
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN

# Session configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
# Set to true in production with HTTPS
server.servlet.session.cookie.secure=false
server.servlet.session.tracking-modes=cookie

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.spring=DEBUG

# File upload configuration
file.upload.dir=./uploads/profile-image
file.upload.base-url=http://localhost:8080/uploads/profile-image
# Server configuration
server.servlet.context-path=
server.port=8080

# Max file size
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

